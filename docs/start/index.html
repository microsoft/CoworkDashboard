<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Reachability check</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0;
         min-height: 100vh; display: grid; place-items: center; background: #0b5cad; color: #fff; }
  .box { max-width: 540px; padding: 32px 36px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { font-size: 15px; line-height: 1.55; opacity: .92; margin: 6px 0; }
  code { background: rgba(255,255,255,.16); padding: 2px 6px; border-radius: 5px; }
</style>
</head>
<body>
  <div class="box">
    <h1>✅ This page is reachable</h1>
    <p>If you can read this without a red "unsafe site" warning, this new path is
       <strong>not</strong> on the SmartScreen blocklist.</p>
    <p>Path under test: <code>/CoworkDashboard/start/</code></p>
    <p>It's a plain static test page — no forms, downloads, or branding.</p>
  </div>
</body>
</html>
